<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fandemia</title>
    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #ff69b4;
            --bg: #f9f8fc;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background-color: #ffffff;
            border-bottom: 2px solid #f0e6fa;
            text-align: center;
            padding: 1.5rem 1rem;
        }

        header .header-logo {
            max-width: 220px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            transition: transform 0.3s ease;
        }

        header .header-logo:hover {
            transform: scale(1.03);
        }

        header p {
            margin-top: 0.5rem;
            margin-bottom: 0;
            font-size: 1.05rem;
            color: var(--primary);
            font-weight: 600;
        }

        nav {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 0.8rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--secondary);
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .content-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .main-img {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        h1 {
            color: var(--primary);
        }

        .empty-placeholder {
            border: 2px dashed #ccc;
            background: #fafafa;
            padding: 3rem 1.5rem;
            border-radius: 8px;
            color: #777;
            text-align: center;
            margin-top: 1.5rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: #1a1a1a;
            color: white;
            margin-top: 2rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html">
            <img src="logo.jpg" alt="Logo Fandemia" class="header-logo">
        </a>
        <p>Tu pasión, tu mundo, tus productos favoritos</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="actividades.html">Contenido Semanal</a>
        <a href="noticias.html">Noticias y Tips</a>
    </nav>

    <div class="container">
        <div class="content-box">
            <img class="main-img" src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=800" alt="Noticias y Novedades">
            
            <h1>Noticias y Tips</h1>

            <div class="empty-placeholder">
                <h3>Próximamente</h3>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Fandemia - Proyecto de Aula</p>
    </footer>

</body>
</html>
